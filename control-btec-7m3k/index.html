<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>StudyMate — Control Room</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="v31-responsive.css?v=31">
  <style>
    body{min-height:100vh}.admin-standalone{max-width:1320px;margin:auto;padding:32px 22px 70px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.admin-top h1{margin:0;font-size:28px}.admin-top p{margin:3px 0 0;color:#8095b4}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.admin-tabs button{padding:10px 14px;border-radius:12px;border:1px solid rgba(107,168,255,.16);background:rgba(7,23,51,.8);color:#93a8c4;font-family:inherit;font-weight:800;cursor:pointer}.admin-tabs button.active{color:#fff;border-color:#4d95ff;background:linear-gradient(135deg,rgba(48,120,255,.25),rgba(25,68,160,.25))}.admin-login-wrap{min-height:80vh;display:grid;place-items:center;padding:24px}.admin-login-card{width:min(520px,100%);padding:28px;border-radius:24px;background:rgba(7,22,49,.88);border:1px solid rgba(98,159,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.admin-login-card h1{margin:0 0 8px}.admin-login-card p{color:#8298b6;line-height:1.8}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:12px 10px;border-bottom:1px solid rgba(120,170,240,.09);text-align:right;font-size:12px;vertical-align:top}.admin-table th{color:#9fcaff}.admin-table td{color:#c3cfdf}.admin-list-scroll{overflow:auto}.status-pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.status-pill.pending{background:#f59e0b1f;color:#ffc65d}.status-pill.done{background:#22c55e1e;color:#65df8a}.status-pill.rejected{background:#ef44441d;color:#ff8989}.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:20px;border-radius:18px;background:rgba(7,24,54,.76);border:1px solid rgba(98,159,255,.14)}.metric b{display:block;font-size:27px;color:#b9ddff}.metric span{font-size:11px;color:#7289aa}@media(max-width:900px){.overview-grid{grid-template-columns:repeat(2,1fr)}.admin-top{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.overview-grid{grid-template-columns:1fr}.admin-standalone{padding:20px 12px 50px}}
  </style>
</head>
<body>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div class="pointer-orb" id="pointerOrb" aria-hidden="true"></div>
  <div class="space-nebula" aria-hidden="true"></div>
  <main id="adminApp"></main>
  <div id="toastRoot" class="toast-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="admin.js"></script>
  <script src="../js/admin-fx.js"></script>
</body>
</html>
