name: Generate PWA Icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/studymate-logo.webp'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG icons from StudyMate logo
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          magick assets/studymate-logo.webp -resize 512x512! assets/studymate-icon-512.png
          magick assets/studymate-logo.webp -resize 192x192! assets/studymate-icon-192.png
          magick assets/studymate-logo.webp -resize 180x180! assets/studymate-apple-touch-icon.png
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/studymate-icon-512.png assets/studymate-icon-192.png assets/studymate-apple-touch-icon.png
          git diff --cached --quiet || git commit -m 'Generate StudyMate PWA icons [skip ci]'
          git push
