name: Generate PWA Icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/studymate-symbol.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG icons from StudyMate symbol
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/studymate-symbol.svg -o assets/studymate-icon-512.png
          rsvg-convert -w 192 -h 192 assets/studymate-symbol.svg -o assets/studymate-icon-192.png
          rsvg-convert -w 180 -h 180 assets/studymate-symbol.svg -o assets/studymate-apple-touch-icon.png
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/studymate-icon-512.png assets/studymate-icon-192.png assets/studymate-apple-touch-icon.png
          git diff --cached --quiet || git commit -m 'Generate StudyMate PWA icons [skip ci]'
          git push
