<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>StudyMate BTEC — كل ما تحتاجه في BTEC</title>
  <meta name="description" content="منصة BTEC تعليمية تجمع التعريف بالنظام، المصطلحات، حاسبة المعدل، الكورسات، المحاضرات، اللابات، الملفات والكويزات." />
  <meta name="theme-color" content="#030916" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StudyMate" />
  <link rel="manifest" href="manifest.json?v=28" />
  <link rel="icon" type="image/webp" href="assets/studymate-logo.webp?v=28" />
  <link rel="apple-touch-icon" href="assets/studymate-logo.webp?v=28" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style id="studymate-boot-css">
    html{background:#05070b}body{opacity:0;transition:opacity .18s ease}html.css-ready body{opacity:1}
    .nav-shell{position:relative!important}
    .brand.brand-logo{min-width:194px!important;height:48px!important;padding:4px 10px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:9px!important;overflow:hidden!important;border-radius:14px!important;background:linear-gradient(135deg,rgba(9,25,55,.92),rgba(6,15,34,.82))!important;border:1px solid rgba(84,153,255,.22)!important;box-shadow:0 10px 30px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.04)!important;flex:0 0 auto!important;direction:ltr!important;color:#fff!important}
    .brand-logo-mark{width:38px!important;height:38px!important;min-width:38px!important;border-radius:11px!important;display:grid!important;place-items:center!important;overflow:hidden!important;background:#07152f!important;border:1px solid rgba(90,165,255,.18)!important;box-shadow:0 0 20px rgba(56,132,255,.14)!important}
    .brand-logo-img{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;object-fit:contain!important;object-position:center!important}
    .brand-logo-copy{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;line-height:1!important;white-space:nowrap!important}
    .brand-logo-copy strong{font-family:Cairo,Arial,sans-serif!important;font-size:15px!important;font-weight:900!important;letter-spacing:-.02em!important;color:#f7fbff!important}
    .brand-logo-copy small{margin-top:5px!important;font-family:Cairo,Arial,sans-serif!important;font-size:8px!important;font-weight:800!important;letter-spacing:.22em!important;color:#57a5ff!important}
    @media(max-width:1180px){.brand.brand-logo{min-width:174px!important;height:46px!important}.brand-logo-mark{width:36px!important;height:36px!important;min-width:36px!important}.brand-logo-copy strong{font-size:14px!important}}
    @media(max-width:900px){
      .nav-shell{min-height:64px!important;justify-content:center!important;padding:8px 12px!important}
      .brand.brand-logo{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;min-width:172px!important;height:46px!important;z-index:5!important;padding:4px 9px!important}
      .mobile-menu{position:relative!important;z-index:6!important;margin-inline-start:auto!important}
    }
    @media(max-width:420px){.brand.brand-logo{min-width:158px!important;height:44px!important}.brand-logo-mark{width:34px!important;height:34px!important;min-width:34px!important}.brand-logo-copy strong{font-size:13px!important}.brand-logo-copy small{font-size:7px!important}}
  </style>
  <script src="js/css-loader.js?v=22"></script>
</head>
<body>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div class="pointer-orb" id="pointerOrb" aria-hidden="true"></div>
  <div class="noise-layer" aria-hidden="true"></div>
  <div class="space-nebula" aria-hidden="true"></div>
  <div class="aurora aurora-a" aria-hidden="true"></div>
  <div class="aurora aurora-b" aria-hidden="true"></div>

  <header class="topbar">
    <div class="nav-shell">
      <button class="brand brand-logo" data-route="home" aria-label="StudyMate BTEC - الصفحة الرئيسية">
        <span class="brand-logo-mark"><img class="brand-logo-img" src="assets/studymate-logo.webp?v=28" alt="" /></span>
        <span class="brand-logo-copy"><strong>StudyMate</strong><small>BTEC</small></span>
      </button>
      <button class="mobile-menu" id="mobileMenu" aria-label="فتح القائمة">☰</button>
      <nav class="nav-pills" id="navPills" aria-label="التنقل الرئيسي">
        <button class="nav-pill active" data-route="home"><span class="nav-dot"></span>الرئيسية</button>
        <button class="nav-pill" data-route="about-btec">تعريف BTEC</button>
        <button class="nav-pill" data-route="glossary">مصطلحات BTEC</button>
        <button class="nav-pill" data-route="calculator">حاسبة المعدل</button>
        <button class="nav-pill" data-route="courses">الكورسات</button>
        <button class="nav-pill" data-route="tasks">المهمات</button>
        <button class="nav-pill" data-route="quizzes">الكويزات</button>
        <div class="nav-more" id="navMore">
          <button class="nav-pill nav-more-toggle" id="navMoreToggle" type="button" aria-expanded="false">المزيد <span>⌄</span></button>
          <div class="nav-more-menu" id="navMoreMenu">
            <button data-route="schedule">الجدول الدراسي</button>
            <button data-route="timer">مؤقت الدراسة</button>
            <button data-route="files">الملفات</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toastRoot" class="toast-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/config.js?v=22"></script>
  <script src="js/app-loader.js?v=22"></script>
  <script src="js/youtube-simple.js?v=22"></script>
  <script src="js/install-guide.js?v=28"></script>
</body>
</html>
